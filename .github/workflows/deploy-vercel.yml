name: Deploy to Vercel (per FI)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fi:
        description: "FI id to deploy (must match a project name below)"
        required: true
        default: "dhakabank"

# One Vercel project per FI for the SPA. Each project has its own
# BFF_URL / IDP_URL / VITE_PROXY_ORIGIN (and optionally its own domain like
# dhakabank.emulator.app).
#
# Architecture: the SPA is pure static. A SEPARATE Vercel project hosts the
# Node proxy (see deploy-proxy-vercel.yml). The browser calls the proxy
# cross-origin at /idp/* and /bff/*. VITE_PROXY_ORIGIN is the proxy's full
# deployment URL.
#
# Required secrets / variables:
#   VERCEL_TOKEN                       — token with deploy rights
#   VERCEL_ORG_ID                      — Vercel team/user id (required by Vercel CLI 60+)
#   VERCEL_PROJECT_ID_DHAKABANK        — Vercel project id for Dhaka Bank SPA
#
# Optional GitHub Actions variables (override defaults):
#   BFF_URL_DHAKABANK
#   IDP_URL_DHAKABANK
#   VITE_PROXY_ORIGIN_DHAKABANK        — full origin of the proxy project
#                                          (e.g. https://emulator-proxy-dhakabank.vercel.app)
jobs:
  deploy:
    name: Deploy ${{ matrix.fi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fi: dhakabank
            token_secret: VERCEL_TOKEN
            project_secret: VERCEL_PROJECT_ID_DHAKABANK
            bff_url_default: "https://fi-bff-dhakabank.fly.dev"
            idp_url_default: "https://fi-idp-dhakabank.fly.dev"
            proxy_origin_default: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Vercel runs the build itself — it reads vercel.json's buildCommand
      # (npm run build) and injects build-time env vars via --build-env.
      # The Vite config bakes them into the bundle as compile-time constants.
      # Runtime env vars for the proxy project are set on the proxy project's
      # Vercel dashboard / `vercel env add`.
      #
      # Why not --prebuilt? Earlier attempts to use `builds` + `vercel
      # build` + `vercel deploy --prebuilt` failed with "Could not retrieve
      # Project Settings" because the runner had no `.vercel/` link to the
      # user's project. Letting Vercel run the build server-side avoids that.
      - name: Deploy to Vercel
        id: vercel-deploy
        run: |
          vercel deploy --yes \
            --token ${{ secrets[matrix.token_secret] }} \
            --target production \
            --build-env BFF_URL="${{ vars.BFF_URL_DHAKABANK || matrix.bff_url_default }}" \
            --build-env IDP_URL="${{ vars.IDP_URL_DHAKABANK || matrix.idp_url_default }}" \
            --build-env VITE_PROXY_ORIGIN="${{ vars.VITE_PROXY_ORIGIN_DHAKABANK || matrix.proxy_origin_default }}"
        env:
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
