name: Deploy to Vercel (per FI)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fi:
        description: "FI id to deploy (must match a project name below)"
        required: true
        default: "dhakabank"

# One Vercel project per FI. Each project has its own BFF_URL / IDP_URL
# (and optionally its own domain like dhakabank.emulator.app).
#
# Required secrets / variables:
#   VERCEL_TOKEN                       — token with deploy rights
#   VERCEL_ORG_ID                      — Vercel team/user id (required by Vercel CLI 60+)
#   VERCEL_PROJECT_ID_DHAKABANK        — Vercel project id for Dhaka Bank
#
# Optional GitHub Actions variables (override defaults baked from fis.json):
#   BFF_URL_DHAKABANK
#   IDP_URL_DHAKABANK
jobs:
  deploy:
    name: Deploy ${{ matrix.fi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fi: dhakabank
            token_secret: VERCEL_TOKEN
            project_secret: VERCEL_PROJECT_ID_DHAKABANK
            bff_url_default: "https://fi-bff-dhakabank.fly.dev"
            idp_url_default: "https://fi-idp-dhakabank.fly.dev"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Vercel runs the build itself — it reads vercel.json's buildCommand
      # (npm run build) and injects build-time env vars (BFF_URL, IDP_URL)
      # via --build-env. The Vite config then bakes them into the bundle.
      # Runtime env vars (also IDP_URL / BFF_URL, used by the /api/proxy
      # server-side function in api/proxy/[...path].ts) are set on the
      # Vercel project via the dashboard / `vercel env add`.
      #
      # Why not --prebuilt? Earlier attempts to use `builds` + `vercel
      # build` + `vercel deploy --prebuilt` failed with "Could not retrieve
      # Project Settings" because the runner had no `.vercel/` link to the
      # user's project. Letting Vercel run the build server-side avoids
      # that entirely — and we pin `regions: ["iad1"]` in vercel.json so
      # the rewrite runs in a region with reliable outbound DNS to fly.io.
      - name: Deploy to Vercel
        id: vercel-deploy
        run: |
          vercel deploy --yes \
            --token ${{ secrets[matrix.token_secret] }} \
            --target production \
            --build-env BFF_URL="${{ vars.BFF_URL_DHAKABANK || matrix.bff_url_default }}" \
            --build-env IDP_URL="${{ vars.IDP_URL_DHAKABANK || matrix.idp_url_default }}"
        env:
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
