name: Deploy to Vercel (per FI)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fi:
        description: "FI id to deploy (must match a project name below)"
        required: true
        default: "dhakabank"

# One Vercel project per FI. Each project has its own BFF_URL / IDP_URL
# (and optionally its own domain like dhakabank.emulator.app).
#
# Required secrets / variables:
#   VERCEL_TOKEN                       — token with deploy rights
#   VERCEL_ORG_ID                      — Vercel team/user id (required by Vercel CLI 60+)
#   VERCEL_PROJECT_ID_DHAKABANK        — Vercel project id for Dhaka Bank
#
# Optional GitHub Actions variables (override defaults baked from fis.json):
#   BFF_URL_DHAKABANK
#   IDP_URL_DHAKABANK
jobs:
  deploy:
    name: Deploy ${{ matrix.fi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fi: dhakabank
            token_secret: VERCEL_TOKEN
            project_secret: VERCEL_PROJECT_ID_DHAKABANK
            bff_url_default: "https://fi-bff-dhakabank.fly.dev"
            idp_url_default: "https://fi-idp-dhakabank.fly.dev"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # vercel.json declares explicit `builds` (because plain Vite does not
      # bundle api/ serverless functions on its own). When `builds` is set,
      # `vercel deploy` no longer runs the build server-side — it expects a
      # prebuilt `.vercel/output/` directory. So we run `vercel build` first
      # and ship the result with `--prebuilt`.
      #
      # `vercel build` does NOT accept `--build-env` (that's a deploy-only
      # flag). Build-time env vars are passed as plain shell env vars — the
      # Vite build reads them via `loadEnv` and bakes them into the bundle
      # via `define`.
      #
      # `--scope` forces the build to fetch the project settings from the
      # team/user that owns the Vercel project (matches VERCEL_ORG_ID). If a
      # local `.vercel/project.json` is present (e.g. from a previous `vercel
      # link` on a dev machine), it shadows the env vars and points at a
      # different project — hence `rm -rf .vercel` first.
      - name: Build with Vercel CLI
        run: |
          rm -rf .vercel
          vercel build --yes \
            --token ${{ secrets[matrix.token_secret] }} \
            --scope ${{ secrets.VERCEL_ORG_ID }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          BFF_URL: ${{ vars.BFF_URL_DHAKABANK || matrix.bff_url_default }}
          IDP_URL: ${{ vars.IDP_URL_DHAKABANK || matrix.idp_url_default }}

      - name: Deploy to Vercel
        id: vercel-deploy
        run: |
          vercel deploy --yes --prebuilt \
            --token ${{ secrets[matrix.token_secret] }} \
            --scope ${{ secrets.VERCEL_ORG_ID }} \
            --target production
        env:
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
