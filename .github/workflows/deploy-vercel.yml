name: Deploy to Vercel (per FI)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fi:
        description: "FI id to deploy (must match a project name below)"
        required: true
        default: "dhakabank"

# One Vercel project per FI. Each project has its own BFF_URL / IDP_URL
# (and optionally its own domain like dhakabank.emulator.app).
#
# Required secrets / variables:
#   VERCEL_TOKEN                       — token with deploy rights
#   VERCEL_ORG_ID                      — Vercel team/user id (required by Vercel CLI 60+)
#   VERCEL_PROJECT_ID_DHAKABANK        — Vercel project id for Dhaka Bank
#
# Optional GitHub Actions variables (override defaults baked from fis.json):
#   BFF_URL_DHAKABANK
#   IDP_URL_DHAKABANK
jobs:
  deploy:
    name: Deploy ${{ matrix.fi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fi: dhakabank
            token_secret: VERCEL_TOKEN
            project_secret: VERCEL_PROJECT_ID_DHAKABANK
            bff_url_default: "https://fi-bff-dhakabank.fly.dev"
            idp_url_default: "https://fi-idp-dhakabank.fly.dev"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Let Vercel run the build itself — it reads vercel.json's buildCommand
      # (npm run build) and injects env vars (BFF_URL, IDP_URL, VITE_IDP_*)
      # from the project settings. This is the standard Vercel flow and
      # avoids Vercel CLI 60's --prebuilt requirement of .vercel/output.
      - name: Deploy to Vercel
        id: vercel-deploy
        run: |
          vercel deploy --yes \
            --token ${{ secrets[matrix.token_secret] }} \
            --target production \
            --build-env BFF_URL="${{ vars.BFF_URL_DHAKABANK || matrix.bff_url_default }}" \
            --build-env IDP_URL="${{ vars.IDP_URL_DHAKABANK || matrix.idp_url_default }}"
        env:
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
